name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Run tests
      run: dotnet test --no-build --verbosity normal --configuration Debug --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

    - name: Code coverage
      run: |
        dotnet test \
          --no-build \
          --configuration Debug \
          /p:CollectCoverage=true \
          /p:CoverageFormat=cobertura \
          /p:CoverageOutputDirectory=./coverage \
          /p:Exclude="[*.Tests]*"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/coverage.cobertura.xml
        flags: unittests
        name: codecov-${{ matrix.os }}

    - name: Check code formatting
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format --verify-no-changes --verbosity quiet

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerable dependencies
      run: dotnet list package --vulnerable

    - name: Run SAST analysis
      run: |
        dotnet build --no-restore --configuration Debug
        dotnet format --verify-no-changes --verbosity quiet || true

  build-success:
    name: Build Success
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: always()
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.security-scan.result }}" = "success" ]; then
          echo "✓ All checks passed"
          exit 0
        else
          echo "✗ Some checks failed"
          exit 1
        fi
