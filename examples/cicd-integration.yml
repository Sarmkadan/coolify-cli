# GitHub Actions CI/CD Integration Examples for Coolify CLI

# Example 1: Simple Deployment on Push to Main
name: Deploy to Coolify

on:
  push:
    branches:
      - main

env:
  COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
  COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      - name: Deploy to Production
        run: |
          # Install coolify-cli
          git clone https://github.com/Sarmkadan/coolify-cli.git
          cd coolify-cli
          dotnet publish -c Release -o ./publish

          # Deploy using the CLI
          ./publish/coolify-cli app deploy ${{ secrets.PROD_APP_ID }} \
            --strategy blue-green \
            --timeout 600

      - name: Verify Deployment
        run: |
          # Check health
          if ! ./coolify-cli/publish/coolify-cli health; then
            echo "Deployment failed - health check"
            exit 1
          fi

      - name: Notify Success
        if: success()
        run: |
          echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: |
          echo "Deployment failed - initiating rollback"
          ./coolify-cli/publish/coolify-cli app rollback ${{ secrets.PROD_APP_ID }}

---

# Example 2: Deploy Specific Environment Based on Tag
name: Deploy by Environment Tag

on:
  push:
    tags:
      - 'release/staging-*'
      - 'release/prod-*'

env:
  COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
  COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == *"staging"* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "app_id=${{ secrets.STAGING_APP_ID }}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "app_id=${{ secrets.PROD_APP_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Coolify CLI
        run: |
          git clone https://github.com/Sarmkadan/coolify-cli.git
          cd coolify-cli
          dotnet publish -c Release -o ./publish

      - name: Deploy to ${{ steps.env.outputs.environment }}
        run: |
          ./coolify-cli/publish/coolify-cli app deploy ${{ steps.env.outputs.app_id }} \
            --strategy canary \
            --timeout 900

      - name: Health Check
        run: ./coolify-cli/publish/coolify-cli health --verbose

---

# Example 3: Scheduled Backup Job
name: Scheduled Database Backup

on:
  schedule:
    # Daily backup at 2 AM UTC
    - cron: '0 2 * * *'

env:
  COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
  COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Coolify CLI
        run: |
          git clone https://github.com/Sarmkadan/coolify-cli.git
          cd coolify-cli
          dotnet publish -c Release -o ./publish

      - name: Create Database Backups
        run: |
          # Backup each database
          for db_id in 1 2 3; do
            echo "Creating backup for database $db_id..."
            ./coolify-cli/publish/coolify-cli db backup create $db_id
            sleep 30
          done

      - name: Verify Backups
        run: |
          for db_id in 1 2 3; do
            echo "Verifying backup for database $db_id..."
            ./coolify-cli/publish/coolify-cli db backup list $db_id --limit 1
          done

      - name: Send Backup Report
        if: success()
        run: |
          echo "All backups completed successfully!"
          # Send notification via Slack, email, etc.

---

# Example 4: Multi-Environment Deployment Pipeline
name: Complete Deployment Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - main

env:
  COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Run Tests
        run: dotnet test -c Release --no-build

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: ./publish

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: build

      - name: Install Coolify CLI
        run: |
          git clone https://github.com/Sarmkadan/coolify-cli.git
          cd coolify-cli
          dotnet publish -c Release -o ./publish

      - name: Deploy to Staging
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_STAGING_API_KEY }}
        run: |
          ./coolify-cli/publish/coolify-cli app deploy ${{ secrets.STAGING_APP_ID }} \
            --strategy rolling \
            --timeout 600

      - name: Smoke Tests
        run: |
          echo "Running smoke tests..."
          # Add your smoke test script here

  deploy-production:
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: build

      - name: Install Coolify CLI
        run: |
          git clone https://github.com/Sarmkadan/coolify-cli.git
          cd coolify-cli
          dotnet publish -c Release -o ./publish

      - name: Pre-Deployment Health Check
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_PROD_API_KEY }}
        run: |
          ./coolify-cli/publish/coolify-cli health --verbose

      - name: Backup Database
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_PROD_API_KEY }}
        run: |
          ./coolify-cli/publish/coolify-cli db backup create ${{ secrets.PROD_DB_ID }}

      - name: Deploy to Production
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_PROD_API_KEY }}
        run: |
          ./coolify-cli/publish/coolify-cli app deploy ${{ secrets.PROD_APP_ID }} \
            --strategy blue-green \
            --timeout 900

      - name: Post-Deployment Verification
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_PROD_API_KEY }}
        run: |
          sleep 30
          if ! ./coolify-cli/publish/coolify-cli health; then
            echo "Post-deployment health check failed!"
            ./coolify-cli/publish/coolify-cli app rollback ${{ secrets.PROD_APP_ID }}
            exit 1
          fi

      - name: Send Notification
        if: always()
        run: |
          # Send Slack/email notification
          echo "Deployment completed"

---

# GitLab CI Configuration Example
stages:
  - build
  - test
  - deploy_staging
  - deploy_production

variables:
  COOLIFY_API_URL: $COOLIFY_API_URL

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet build -c Release
  artifacts:
    paths:
      - publish/
    expire_in: 1 day

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet test -c Release

deploy_staging:
  stage: deploy_staging
  image: mcr.microsoft.com/dotnet/runtime:10.0
  only:
    - develop
    - staging
  before_script:
    - git clone https://github.com/Sarmkadan/coolify-cli.git
    - cd coolify-cli && dotnet publish -c Release -o ./publish && cd ..
  script:
    - ./coolify-cli/publish/coolify-cli app deploy $STAGING_APP_ID --strategy rolling
  after_script:
    - ./coolify-cli/publish/coolify-cli health --verbose

deploy_production:
  stage: deploy_production
  image: mcr.microsoft.com/dotnet/runtime:10.0
  only:
    - main
  when: manual
  before_script:
    - git clone https://github.com/Sarmkadan/coolify-cli.git
    - cd coolify-cli && dotnet publish -c Release -o ./publish && cd ..
  script:
    - ./coolify-cli/publish/coolify-cli db backup create $PROD_DB_ID
    - ./coolify-cli/publish/coolify-cli app deploy $PROD_APP_ID --strategy blue-green
  after_script:
    - sleep 30
    - ./coolify-cli/publish/coolify-cli health --verbose
